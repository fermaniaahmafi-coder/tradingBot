<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login &bull; Hermes Solana Sniper Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-faint: #64748b;
      --lime: #9ef32b;
      --lime-glow: rgba(158, 243, 43, 0.25);
      --emerald: #10b981;
      --rose: #f43f5e;
      --rose-bg: rgba(244, 63, 94, 0.12);
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background grid and glow */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 50% 20%, rgba(158, 243, 43, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 20% 80%, rgba(139, 92, 246, 0.05) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .grid-pattern {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    .auth-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(158, 243, 43, 0.1);
      border: 1px solid rgba(158, 243, 43, 0.25);
      border-radius: 9999px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--lime);
      letter-spacing: 0.04em;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .brand-badge .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 8px var(--lime);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .brand-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .brand-title span {
      background: linear-gradient(135deg, #ffffff 30%, var(--lime) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Card styling */
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
      letter-spacing: 0.01em;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-faint);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-input {
      width: 100%;
      padding: 13px 14px 13px 44px;
      background: rgba(2, 6, 23, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-family: var(--font-sans);
      font-size: 14px;
      color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--lime);
      box-shadow: 0 0 0 3px rgba(158, 243, 43, 0.15);
      background: rgba(2, 6, 23, 0.85);
    }

    .toggle-pass-btn {
      position: absolute;
      right: 14px;
      background: transparent;
      border: none;
      color: var(--text-faint);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: color 0.15s ease;
    }

    .toggle-pass-btn:hover {
      color: var(--text-main);
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 13px;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .remember-label input[type="checkbox"] {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
      position: relative;
      display: grid;
      place-content: center;
      transition: all 0.15s ease;
    }

    .remember-label input[type="checkbox"]:checked {
      background: var(--lime);
      border-color: var(--lime);
    }

    .remember-label input[type="checkbox"]:checked::after {
      content: "";
      width: 9px;
      height: 5px;
      border-left: 2px solid #000000;
      border-bottom: 2px solid #000000;
      transform: rotate(-45deg) translate(1px, -1px);
    }

    .auth-alert {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      align-items: center;
      gap: 10px;
      line-height: 1.4;
    }

    .auth-alert.error {
      display: flex;
      background: var(--rose-bg);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
    }

    .auth-alert.success {
      display: flex;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    .submit-btn {
      width: 100%;
      padding: 14px 20px;
      background: var(--lime);
      color: #050b14;
      border: none;
      border-radius: 12px;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 14px rgba(158, 243, 43, 0.25);
    }

    .submit-btn:hover:not(:disabled) {
      background: #b1fa48;
      box-shadow: 0 6px 20px rgba(158, 243, 43, 0.35);
      transform: translateY(-1px);
    }

    .submit-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0, 0, 0, 0.2);
      border-top-color: #000000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-faint);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .auth-footer svg {
      width: 13px;
      height: 13px;
      color: var(--lime);
    }
  </style>
</head>
<body>
  <div class="grid-pattern"></div>

  <div class="auth-container">
    <div class="brand-header">
      <div class="brand-badge">
        <span class="pulse-dot"></span>
        <span>Hermes System Security</span>
      </div>
      <h1 class="brand-title"><span>Hermes Sniper</span></h1>
      <p class="brand-desc">Portal Otentikasi Akses Bot Solana Micro-Scalping</p>
    </div>

    <div class="auth-card">
      <div id="authAlert" class="auth-alert"></div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input 
              type="text" 
              id="username" 
              name="username" 
              class="form-input" 
              placeholder="Masukkan username" 
              required 
              autofocus
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="Masukkan password" 
              required
            >
            <button type="button" class="toggle-pass-btn" id="togglePass" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-label">
            <input type="checkbox" id="rememberMe" checked>
            <span>Ingat sesi saya</span>
          </label>
          <span style="font-size: 11px; color: var(--text-faint); font-family: var(--font-mono);">JWT HS256</span>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span class="spinner" id="btnSpinner"></span>
          <span id="btnText">Masuk ke Dashboard</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </form>
    </div>

    <div class="auth-footer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <span>Dilindungi dengan Token JWT &bull; Hermes Solana AI Engine</span>
    </div>
  </div>

  <script>
    // Password visibility toggle
    const togglePass = document.getElementById('togglePass');
    const passInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePass.addEventListener('click', () => {
      const isPass = passInput.type === 'password';
      passInput.type = isPass ? 'text' : 'password';
      eyeIcon.innerHTML = isPass 
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
    });

    // Form submit
    const loginForm = document.getElementById('loginForm');
    const authAlert = document.getElementById('authAlert');
    const submitBtn = document.getElementById('submitBtn');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('rememberMe').checked;

      // Reset alert
      authAlert.style.display = 'none';
      authAlert.className = 'auth-alert';
      
      // Loading state
      submitBtn.disabled = true;
      btnSpinner.style.display = 'inline-block';
      btnText.textContent = 'Memverifikasi...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, remember })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          authAlert.className = 'auth-alert success';
          authAlert.textContent = 'Login berhasil! Mengalihkan ke dashboard...';
          authAlert.style.display = 'flex';

          // Simpan token di localStorage sebagai backup
          if (data.token) {
            localStorage.setItem('hermes_token', data.token);
          }

          // Dapatkan URL tujuan redirect dari parameter query 'next'
          const urlParams = new URLSearchParams(window.location.search);
          const nextUrl = urlParams.get('next') || '/';

          setTimeout(() => {
            window.location.href = nextUrl;
          }, 600);
        } else {
          authAlert.className = 'auth-alert error';
          authAlert.textContent = data.error || 'Username atau password salah.';
          authAlert.style.display = 'flex';
          submitBtn.disabled = false;
          btnSpinner.style.display = 'none';
          btnText.textContent = 'Masuk ke Dashboard';
        }
      } catch (err) {
        authAlert.className = 'auth-alert error';
        authAlert.textContent = 'Gagal terhubung ke server. Pastikan bot service berjalan.';
        authAlert.style.display = 'flex';
        submitBtn.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.textContent = 'Masuk ke Dashboard';
      }
    });
  </script>
</body>
</html>
